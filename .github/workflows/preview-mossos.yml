name: Descargar fotos de Mossos (Wikimedia Commons)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-mossos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar originales
        run: |
          UA="opos365-video/1.0 (https://github.com/gadivi94/remotion-video)"
          D=opos365-video/public/fotos
          mkdir -p $D
          get() { curl -fsSL -A "$UA" -o "$D/$1" "$2"; sleep 2; }
          get arona.jpg          "https://upload.wikimedia.org/wikipedia/commons/b/b4/SEAT_Arona_-_Mossos_d%27Esquadra.jpg"
          get brimo-nit.jpg      "https://upload.wikimedia.org/wikipedia/commons/3/3e/BRIMO_furgoneta_nit.jpg"
          get transit.jpg        "https://upload.wikimedia.org/wikipedia/commons/b/b8/Unitat_de_Transit_cotxe_patrulla.jpg"
          get brimo-rambla.jpg   "https://upload.wikimedia.org/wikipedia/commons/e/e7/Furgoneta_BRIMO_a_La_Rambla.jpg"
          get qashqai.jpg        "https://upload.wikimedia.org/wikipedia/commons/3/3d/Nissan_Qashqai_Mossos_d%C2%B4Esquadra._Barcelona_%289299533658%29.jpg"
          get furgoneta-jutjats.jpg "https://upload.wikimedia.org/wikipedia/commons/2/26/Furgoneta_transport_presoners_jutjats.jpg"
          ls -la $D
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opos365-video/public/fotos
          git commit -m "Fotos de vehículos de Mossos (Wikimedia Commons, CC BY 2.0 / dominio público)" || exit 0
          git push
